name: Environment Migration Parity

on:
  pull_request:
  push:
    branches:
      - main
      - feat/vision-v2

jobs:
  legacy-pip:
    name: Legacy pip path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install legacy dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke tests
        env:
          PYTHONPATH: src
          COLPALI_USE_MOCK: "true"
          VECTOR_BACKEND: faiss
        run: |
          pytest tests/unit/test_v2_eval.py tests/unit/test_v2_pipeline_smoke.py -q -o addopts=

  uv-sync:
    name: UV sync path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Sync uv core + dev environments
        run: |
          uv sync --extra dev
      - name: Smoke tests
        env:
          PYTHONPATH: src
          COLPALI_USE_MOCK: "true"
          VECTOR_BACKEND: faiss
        run: |
          uv run pytest tests/unit/test_v2_eval.py tests/unit/test_v2_pipeline_smoke.py -q -o addopts=
