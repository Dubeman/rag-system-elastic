name: Eval gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-hub-${{ hashFiles('uv.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install core + dev deps
        run: uv sync --extra dev

      - name: Unit tests
        run: uv run pytest tests/unit/ -q --no-header

      - name: Start Elasticsearch (smoke compose)
        run: docker compose -f docker-compose.smoke.yml up -d --wait
        timeout-minutes: 10

      - name: Seed eval corpus
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: uv run python eval/seed_eval_index.py

      - name: Start API
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          nohup uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000 > /tmp/rag_api.log 2>&1 &
          echo $! > /tmp/rag_api.pid
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/healthz >/dev/null; then
              echo "API ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "--- API log (tail) ---"
          tail -200 /tmp/rag_api.log || true
          exit 1

      - name: Smoke eval (5 queries) — gate on evidence_recall@5
        run: |
          uv run python eval/run_eval.py \
            --api http://localhost:8000 \
            --pipeline v1 \
            --smoke \
            --k-values 5 \
            --fail-under-evidence-recall-at-5 0.6

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/rag_api.pid ]; then kill "$(cat /tmp/rag_api.pid)" 2>/dev/null || true; fi

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.smoke.yml down -v
