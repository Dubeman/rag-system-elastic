[project]
name = "rag-system-elastic"
version = "0.0.0"
description = "Hybrid and vision-native RAG system"
requires-python = ">=3.9,<3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "streamlit==1.28.1",
    "pydantic>=2.4.2,<2.11",
    "python-dotenv==1.0.0",
    "elasticsearch==8.11.0",
    "sentence-transformers==2.2.2",
    "transformers==4.35.2",
    "torch==2.1.1",
    "huggingface-hub>=0.19.4,<0.20",
    "numpy==1.24.3",
    "pypdf==3.17.1",
    "pdfminer.six==20221105",
    "python-multipart>=0.0.6,<0.0.21",
    "google-api-python-client==2.108.0",
    "google-auth-httplib2==0.1.1",
    "google-auth-oauthlib==1.1.0",
    "prometheus-client==0.20.0",
    "prometheus-fastapi-instrumentator==5.11.2",
    "pymupdf==1.24.14",
    "faiss-cpu>=1.7.4,<1.9",
    "qdrant-client>=1.7.0",
    "httpx==0.25.2",
    "aiofiles==23.2.1",
    "python-json-logger==2.0.7",
    "tenacity==8.2.3",
]

[project.optional-dependencies]
notebook = [
    "gradio==4.44.1",
    "langgraph>=0.6.0,<0.7",
    "langchain-core>=0.3.0,<0.4",
    "langfuse>=4.0.0,<5.0.0",
    "pydantic==2.10.6",
    "huggingface-hub==0.19.4",
]
train = [
    "transformers==4.35.2",
    "datasets==2.16.1",
    "accelerate==0.27.2",
    "peft==0.9.0",
]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "isort==5.12.0",
    "flake8==6.1.0",
    "pre-commit==3.6.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
